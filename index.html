<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #eef1f0; color: #15201d; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .gate { background: #fff; border: 1px solid #d3dbd8; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 32px 28px; width: 100%; max-width: 380px; text-align: center; }

  .sub { font-size: 13px; color: #8a9893; margin-bottom: 22px; }
  .lock { font-size: 40px; margin-bottom: 14px; }
  input { width: 100%; border: 1.5px solid #d1d5db; border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; color: #15201d; background: #f9fafb; margin-bottom: 12px; }
  input:focus { border-color: #1b7f95; background: #fff; }
  button { width: 100%; background: #1b7f95; border: none; color: #fff; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .err { color: #dc2626; font-size: 13px; font-weight: 600; margin-top: 12px; min-height: 18px; }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptApp(password) {
  const salt = b64(PAYLOAD.salt), iv = b64(PAYLOAD.iv), ct = b64(PAYLOAD.ct);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
    km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']
  );
  const buf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, ct);
  const text = new TextDecoder().decode(buf);
  if (!text.startsWith('TOM_OK|')) throw new Error('sello');
  return text.slice(7);
}

async function enter() {
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  const pw = document.getElementById('pw').value;
  if (!pw) { err.textContent = 'Introduce la contraseña.'; return; }
  btn.disabled = true; err.textContent = 'Descifrando…';
  try {
    const html = await decryptApp(pw);
    // Recordar en este dispositivo: solo se pide la primera vez
    await savePw(pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    // Solo se olvida la clave si de verdad es incorrecta; un fallo puntual no la borra
    if (e && (e.name === 'OperationError' || e.message === 'sello')) {
      await forgetPw();
      err.textContent = 'Contraseña incorrecta.';
    } else {
      err.textContent = 'No se pudo abrir (' + ((e && e.message) || e) + '). Reintenta.';
    }
    btn.disabled = false;
  }
}

// La clave se guarda en localStorage y, por duplicado, en IndexedDB (si el navegador vacía una, queda la otra)
function gateDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tomas-gate', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPw(op, v) {
  try {
    const db = await gateDb();
    return await new Promise((res) => {
      const tx = db.transaction('k', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('k');
      if (op === 'get') { const q = st.get('pw'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
      else { if (op === 'set') st.put(v, 'pw'); else st.delete('pw'); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }
    });
  } catch (_) { return null; }
}
async function savePw(pw) {
  try { localStorage.setItem('tom_pw', pw); } catch (_) {}
  await idbPw('set', pw);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
}
async function forgetPw() {
  try { localStorage.removeItem('tom_pw'); } catch (_) {}
  await idbPw('del');
}

document.getElementById('go').addEventListener('click', enter);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });

(async () => {
  let saved = null;
  try { saved = localStorage.getItem('tom_pw'); } catch (_) {}
  if (!saved) saved = await idbPw('get');
  if (saved) {
    document.getElementById('pw').value = saved;
    enter();
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
